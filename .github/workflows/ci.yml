name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:ui
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run workspace UI smoke test
        run: |
          npm run dev > /tmp/seum-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5190/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5190/api/health > /dev/null
          node tests/browser-workspace.mjs
      - name: Upload desktop and mobile UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seum-workspace-ui
          path: .local/*.png
          if-no-files-found: ignore
